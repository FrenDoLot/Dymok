server {
    listen 80;
    listen [::]:80;
    server_name dymok.193.124.91.112.sslip.io dymok.193.124.91.112.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/dymok-web;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dymok.193.124.91.112.sslip.io;

    ssl_certificate /etc/letsencrypt/live/dymok.193.124.91.112.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dymok.193.124.91.112.sslip.io/privkey.pem;

    root /var/www/dymok-web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18820/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1200;
        proxy_connect_timeout 30;
        proxy_send_timeout 1200;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

